<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- StickyBoard app icon: a yellow sticky note with a folded corner.
       Regenerate the icon files with: npx tauri icon src-tauri/app-icon.svg -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffcf3f"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b705"/>
      <stop offset="1" stop-color="#ffe9a3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#5a4300" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="rotate(-4 512 512)" filter="url(#shadow)">
    <path d="M168 132 H856 V656 L664 864 H168 Z" fill="url(#paper)"/>
    <path d="M856 656 H700 Q664 656 664 692 V864 Z" fill="url(#fold)"/>
    <g stroke="#6366f1" stroke-width="40" stroke-linecap="round" fill="none">
      <path d="M268 330 H720"/>
      <path d="M268 470 H700"/>
      <path d="M268 610 H520"/>
    </g>
  </g>
</svg>
